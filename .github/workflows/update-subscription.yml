name: Update Subscription

on:
  schedule:
    # 每 2 小时运行一次（UTC 时间，分钟数为 17 以避免整点高峰）
    - cron: '17 */2 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 必须写入权限，才能推送提交

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests pyyaml

      - name: Run subscription updater
        run: |
          python scripts/update_subscription.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update subscription [skip ci]"
          file_pattern: subscription.yaml
          commit_options: '--no-verify'
          push_options: '--force'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
